<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171a22" />
    <title>Princess Coin Drive</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Princess Coin Drive game canvas"></canvas>
      <section id="hud" aria-live="polite">
        <div id="progress-wrap">
          <span id="level-label">Level 1</span>
          <div id="progress-track"><div id="progress-fill"></div></div>
        </div>
        <div class="hud-metric">
          <span>Coins</span>
          <strong><span id="score-value">0</span>/<span id="target-value">24</span></strong>
        </div>
        <div id="heart-row" aria-label="Hearts"></div>
        <button id="pause-button" class="icon-button" type="button" aria-label="Pause">II</button>
        <button id="mute-button" class="icon-button" type="button" aria-label="Mute">♪</button>
      </section>
      <div id="event-banner" aria-live="polite"></div>
      <section id="game-overlay" class="hidden" aria-live="polite">
        <div class="overlay-panel">
          <span id="overlay-kicker">Princess Coin Drive</span>
          <h1 id="overlay-title">Ready</h1>
          <p id="overlay-copy">Collect royal coins on the way to the castle.</p>
          <div class="overlay-actions">
            <button id="primary-action" type="button">Start</button>
            <button id="secondary-action" type="button">Restart</button>
          </div>
        </div>
      </section>
      <div id="touch-controls" aria-hidden="true">
        <div id="steering-wheel">
          <div class="wheel-ring"></div>
          <div class="wheel-spoke wheel-spoke-a"></div>
          <div class="wheel-spoke wheel-spoke-b"></div>
          <div class="wheel-hub"></div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
